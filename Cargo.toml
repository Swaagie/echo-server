[package]
name = "echo-server"
version = "3.0.0"
authors = ["Martijn Swaagman <martijn@swaagman.online>"]
description = "HTTP echo server"
edition = "2021"
license = "MIT"
keywords = ["echo", "server", "http"]
exclude = [
  ".github",
  "Dockerfile"
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hyper = { version = "1.8.1", features = ["full"] }
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3.31"
rustls = "0.23.35"
rustls-pki-types = "1.9.0"
tokio-rustls = "0.26.4"
toml = "0.9.8"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.8"
hyper-util = { version = "0.1.19", features = ["full"] }
http-body-util = "0.1.3"
http-body = "1.0.1"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11", optional = true }

[features]
default = []
http3 = ["h3", "h3-quinn", "quinn"]

[dev-dependencies]
tokio-test = "0.4.4"
