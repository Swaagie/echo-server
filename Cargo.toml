[package]
name = "echo-server"
version = "3.0.0"
authors = ["Martijn Swaagman <martijn@swaagman.online>"]
description = "HTTP echo server"
edition = "2021"
license = "MIT"
keywords = ["echo", "server", "http"]
exclude = [
  ".github",
  "Dockerfile"
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hyper = { version = "1.11.0", features = ["full"] }
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.34"
rustls = "0.23.43"
rustls-pki-types = "1.15.1"
tokio-rustls = "0.26.4"
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.5"
http-body = "1.1.0"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
# Pinned to aws-lc-rs (and away from the default `rustls-ring`) so exactly one
# rustls CryptoProvider is ever compiled in. Two providers make
# `ServerConfig::builder()` panic at runtime.
quinn = { version = "0.11", optional = true, default-features = false, features = [
  "runtime-tokio",
  "rustls-aws-lc-rs",
  "rustls-log",
  "log",
  "bloom",
  "platform-verifier",
] }

[features]
default = []
http3 = ["h3", "h3-quinn", "quinn"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "aws_lc_rs"] }
tokio-stream = "0.1.19"
tokio-test = "0.4.5"
