# Echo server configuration for the Docker Compose example.
#
# Serves HTTP/2 over TLS (TCP) and HTTP/3 over QUIC (UDP) on the same port,
# using the self-signed certificate generated by the `certs` service.

port = 8443

# "auto" starts h2 on TCP and, when the binary is built with --features http3,
# h3 on UDP. Responses over h2 advertise the h3 endpoint via Alt-Svc.
protocol = "auto"

[tls]
server_cert = "/certs/server.crt"
server_key = "/certs/server.key"

# Client certificates are not required for this example. To try mTLS, set this
# to true and point ca_cert at the CA that signed your client certificate.
require_client_certs = false
# ca_cert = "/certs/ca.crt"
