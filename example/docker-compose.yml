version: '3.8'

services:
  echo-server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config.toml:/server/config.toml:ro
    environment:
      RUST_LOG: debug
    command: ["--config", "/server/config.toml"]
    restart: unless-stopped

  # Example with mTLS enabled
  # Uncomment and configure paths to your certificates
  # echo-server-mtls:
