services:
  # Generates a self-signed certificate for localhost, then exits.
  certs:
    image: alpine:3.20
    volumes:
      - certs:/certs
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        if [ ! -f /certs/server.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout /certs/server.key -out /certs/server.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:echo-server,IP:127.0.0.1"
        fi
        # Throwaway development key, read by a non-root user.
        chmod 644 /certs/server.key /certs/server.crt

  echo-server:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        FEATURES: http3   # the HTTP/3 listener
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "8443:8443/tcp"   # HTTP/2 over TLS
      - "8443:8443/udp"   # HTTP/3 over QUIC
    volumes:
      - certs:/certs:ro
      - ./config.toml:/server/config.toml:ro
    environment:
      RUST_LOG: info
    command: ["--config", "/server/config.toml"]
    restart: unless-stopped

volumes:
  certs:
