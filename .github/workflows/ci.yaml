name: Rust CICD
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install cargo-audit
      shell: bash
      run: |
        cargo install cargo-audit --locked
    - name: Audit dependencies for security advisories
      shell: bash
      run: |
        cargo audit

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup rustfmt and clippy
      shell: bash
      run: |
        rustup component add rustfmt clippy
    - name: Run rustfmt check
      shell: bash
      run: |
        cargo fmt --all -- --check
    - name: Run clippy check
      shell: bash
      run: |
        cargo clippy --all-targets --all-features -- -D warnings
    - name: Test (default features)
      shell: bash
      run: |
        cargo test --locked
    - name: Test (all features)
      shell: bash
      run: |
        cargo test --locked --all-features
    - name: Release build
      run: |
        cargo build --release --all-features
    - name: Check the tag matches the package version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        tag="${GITHUB_REF_NAME#v}"
        package=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
        if [ "$tag" != "$package" ]; then
          echo "tag v$tag does not match package version $package"
          exit 1
        fi
    - name: Publish
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
